<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | Adaptive Fraud Detection</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#edf4ff;font:16px Arial}
main{width:min(420px,90vw);padding:28px;background:#121d30;border:1px solid #26364f;border-radius:14px}
input{display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0 18px;border-radius:7px;border:1px solid #52627a}
button{padding:12px 18px;border:0;border-radius:7px;background:#31d0aa;font-weight:bold;cursor:pointer}
.errorlist{color:#ff9aab}
</style></head>
<body><main><h2>Adaptive Fraud Detection</h2><p>Sign in to access the dashboard.</p>
{% if form.errors %}<p class="errorlist">Username or password is incorrect.</p>{% endif %}
<form method="post">{% csrf_token %}
<label for="id_username">Username</label>{{ form.username }}
<label for="id_password">Password</label>{{ form.password }}
{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
<button type="submit">Sign in</button></form></main></body></html>
